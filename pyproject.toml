[project]
name = "grandmas-bouncer"
version = "0.1.0"
description = "A Strands Decider 2B guardrail that stops scam emails from hijacking an AI assistant's tool calls."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "strands-agents>=1.61",
    "boto3>=1.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# The decider server is heavy (torch); keep it optional so the agent can talk to a remote server.
decider = ["strands-decider>=0.2"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grandmas_bouncer", "src/decider_patterns"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "decider: needs a running strands-decider server",
    "bedrock: needs AWS credentials with Bedrock access",
]
